      pt: [trimetilamina]
  - name: pyridine
    formula: C5H5N
    constants: [1.7e-9]
    aliases:
      es: [piridina]
      pt: [piridina]
  - name: aniline
    formula: C6H5NH2
    constants: [4.3e-10]
    aliases:
      es: [anilina]
      pt: [anilina]
  - name: hydrazine
    formula: N2H4
    constants: [1.7e-6]
    aliases:
