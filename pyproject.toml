[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dissociation"
version = "0.1.0"
description = "Exact acid-base equilibrium: pH, speciation, buffers and titration curves, solved rather than approximated."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]
keywords = ["chemistry", "equilibrium", "ph", "titration", "buffer", "speciation", "analytical-chemistry"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
]

[project.scripts]
dissociation = "dissociation:demo"

[project.urls]
Homepage = "https://github.com/cangrejometralleta/dissociation"
Source = "https://github.com/cangrejometralleta/dissociation"

[tool.setuptools.packages.find]
include = ["dissociation*"]

[tool.setuptools.package-data]
dissociation = ["constants/*.yaml"]

[tool.ruff]
line-length = 100

# The gate Catches bugs, never taste. The order of `__all__` is Deliberate,
# so no formatter Reflows it.
[tool.ruff.lint]
select = ["E", "F", "B"]
